name: Publish (unsigned preview)

# 说明：
#   官方正式发布流程（MSIX/NSIS 签名、deb/rpm、NSIS 安装包）依赖仓库外的 SteamTools-Team/Credentials
#   与 SteamTools-Team/NSIS-Build，以及签名证书口令等 secrets，fork 中不可用。
#   这里的 Publish 只做「可运行的未签名预览包」，用于验证发布链路能编译通过：
#     - 框架依赖（--self-contained false）的 win-x64 输出 + zip + SHA256
#     - 需要完整安装包时，请使用 src/BD.WTTS.Client.Tools.Publish（可执行名 pub），见 AGENTS.md §6。

on:
  push:
    tags: [ '*' ]
  workflow_dispatch:

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages
  PROJECT: src/BD.WTTS.Client.Avalonia.App/BD.WTTS.Client.Avalonia.App.csproj
  TFM: net11.0-windows10.0.19041.0

jobs:
  win-x64:
    name: Windows x64 (framework-dependent, unsigned)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup .NET (from global.json)
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Cache NuGet
        uses: actions/cache@v4
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: nuget-${{ runner.os }}-${{ hashFiles('global.json', 'NuGet.Config', 'src/Directory.Packages.props', 'ref/DirectoryPackages/Directory.Packages.props') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Publish (win-x64)
        run: dotnet publish ${{ env.PROJECT }} -c Release -f ${{ env.TFM }} -r win-x64 --self-contained false -p:DebugType=none -o out/win-x64 --nologo

      - name: Package
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME
          if ([string]::IsNullOrWhiteSpace($tag)) { $tag = 'manual' }
          $name = "WattToolkit_${tag}_win-x64_unsigned.zip"
          Compress-Archive -Path out/win-x64/* -DestinationPath $name -Force
          $hash = (Get-FileHash $name -Algorithm SHA256).Hash
          "$hash  $name" | Set-Content -Path "$name.sha256" -Encoding ascii
          "ARTIFACT_NAME=$name" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Get-ChildItem $name, "$name.sha256" | Select-Object Name, Length | Format-Table -AutoSize

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: watt-toolkit-win-x64-unsigned
          path: |
            WattToolkit_*_win-x64_unsigned.zip
            WattToolkit_*_win-x64_unsigned.zip.sha256
          if-no-files-found: error
          retention-days: 14
