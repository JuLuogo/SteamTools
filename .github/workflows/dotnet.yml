name: Build

# 构建 + 单元测试。
# 与仓库现状对齐的要点：
#   - 解决方案文件是 WattToolkit.slnx（不是已删除的 SteamToolsV2+.sln）
#   - SDK 版本由 global.json 决定（.NET 11，允许 preview）
#   - TFM 来自 src/TFM_NETX_*.props；根 Directory.Build.targets 会在 Windows 上自动剔除 -macos，
#     因此 Windows/Linux runner 不需要安装 Apple workload。
#   - 只构建主程序与测试工程：插件由 UnitTest 的 ProjectReference 间接覆盖（仅 Windows）。
#   - 不构建 BD.WTTS.Client.AppHost（net35/net40 需要 .NET Framework targeting pack，且发布时才用到）。

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages
  # Linux/macOS runner 上 NuGet 对 Splat 19.3.1 等包做签名链校验会因证书吊销失败（NU3012），
  # 改为离线吊销模式即可正常还原（不影响包完整性校验）。
  NUGET_CERT_REVOCATION_MODE: offline

jobs:
  windows:
    name: Windows / net11.0-windows10.0.19041.0
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      # 注意：global.json 里的 SDK 版本写作 11.0.0，而 SDK 的实际版本号是 11.0.100-rc.x 这类形式，
      # 两者都不能直接喂给 setup-dotnet 的 global-json-file（会去下载不存在的 11.0.0 → 404）。
      # 这里改用 11.0.x 频道：优先正式版，未发布时回退 preview；
      # global.json 的 rollForward=latestMajor + allowPrerelease=true 会接受任一 >= 11.0.0 的 SDK。
      - name: Setup .NET 11 (GA)
        id: dotnet-ga
        uses: actions/setup-dotnet@v4
        continue-on-error: true
        with:
          dotnet-version: 11.0.x

      - name: Setup .NET 11 (preview fallback)
        if: steps.dotnet-ga.outcome == 'failure'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 11.0.x
          dotnet-quality: preview

      - name: Cache NuGet
        uses: actions/cache@v4
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: nuget-${{ runner.os }}-${{ hashFiles('global.json', 'NuGet.Config', 'src/Directory.Packages.props', 'ref/DirectoryPackages/Directory.Packages.props') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Build main app
        run: dotnet build src/BD.WTTS.Client.Avalonia.App/BD.WTTS.Client.Avalonia.App.csproj -c Release -f net11.0-windows10.0.19041.0 --nologo

      - name: Run unit tests
        run: dotnet test src/BD.WTTS.UnitTest/BD.WTTS.UnitTest.csproj -c Release -f net11.0-windows10.0.19041.0 --nologo

  linux:
    name: Linux / net11.0
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      # 注意：global.json 里的 SDK 版本写作 11.0.0，而 SDK 的实际版本号是 11.0.100-rc.x 这类形式，
      # 两者都不能直接喂给 setup-dotnet 的 global-json-file（会去下载不存在的 11.0.0 → 404）。
      # 这里改用 11.0.x 频道：优先正式版，未发布时回退 preview；
      # global.json 的 rollForward=latestMajor + allowPrerelease=true 会接受任一 >= 11.0.0 的 SDK。
      - name: Setup .NET 11 (GA)
        id: dotnet-ga
        uses: actions/setup-dotnet@v4
        continue-on-error: true
        with:
          dotnet-version: 11.0.x

      - name: Setup .NET 11 (preview fallback)
        if: steps.dotnet-ga.outcome == 'failure'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 11.0.x
          dotnet-quality: preview

      - name: Cache NuGet
        uses: actions/cache@v4
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: nuget-${{ runner.os }}-${{ hashFiles('global.json', 'NuGet.Config', 'src/Directory.Packages.props', 'ref/DirectoryPackages/Directory.Packages.props') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Build main app
        run: dotnet build src/BD.WTTS.Client.Avalonia.App/BD.WTTS.Client.Avalonia.App.csproj -c Release -f net11.0 --nologo

  macos:
    # .NET 11 的 macOS SDK 要求 Xcode 27.0，而当前 GitHub 托管 runner 只有 Xcode 26.6
    # （error: This version of .NET for macOS requires Xcode 27.0），因此这里以 advisory 方式运行：
    # 失败不阻塞整体 workflow；等 runner 镜像升级 Xcode 后可去掉 continue-on-error。
    name: macOS / net11.0-macos (advisory, needs Xcode 27)
    runs-on: macos-latest
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      # 注意：global.json 里的 SDK 版本写作 11.0.0，而 SDK 的实际版本号是 11.0.100-rc.x 这类形式，
      # 两者都不能直接喂给 setup-dotnet 的 global-json-file（会去下载不存在的 11.0.0 → 404）。
      # 这里改用 11.0.x 频道：优先正式版，未发布时回退 preview；
      # global.json 的 rollForward=latestMajor + allowPrerelease=true 会接受任一 >= 11.0.0 的 SDK。
      - name: Setup .NET 11 (GA)
        id: dotnet-ga
        uses: actions/setup-dotnet@v4
        continue-on-error: true
        with:
          dotnet-version: 11.0.x

      - name: Setup .NET 11 (preview fallback)
        if: steps.dotnet-ga.outcome == 'failure'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 11.0.x
          dotnet-quality: preview

      # macOS 上 BD.WTTS.Client 走 TFM_NETX_WITH_ALL，TFM 列表会带上 net11.0-ios / net11.0-maccatalyst，
      # 因此不能只装 macos workload；用 workload restore 让 SDK 按项目自动安装所需 workload。
      - name: Show Xcode version
        run: xcodebuild -version || true

      - name: Restore workloads
        run: dotnet workload restore src/BD.WTTS.Client.Avalonia.App/BD.WTTS.Client.Avalonia.App.csproj

      - name: Build main app
        run: dotnet build src/BD.WTTS.Client.Avalonia.App/BD.WTTS.Client.Avalonia.App.csproj -c Release -f net11.0-macos --nologo
